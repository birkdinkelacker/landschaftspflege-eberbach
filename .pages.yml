media:
  input: public/images
  output: /images
  extensions: [jpg, jpeg, png, webp, avif, gif]
  rename: safe

settings:
  content:
    merge: true
  commit:
    identity: app

content:
  - name: site
    label: Allgemeine Angaben
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
      rename: false
    fields:
      - name: title
        label: Seitentitel im Browser
        type: string
        required: true
      - name: description
        label: Beschreibung für Suchmaschinen
        type: text
        required: true
      - name: brandTitle
        label: Name oben im Logo
        type: string
        required: true
      - name: brandLogo
        label: Logo
        type: image
        required: true
        description: Das Bildzeichen neben dem Firmennamen. Am besten ein quadratisches PNG mit transparentem Hintergrund auswählen.
      - name: brandSubtitle
        label: Zusatz unter dem Logo
        type: string
        required: true
      - name: companyName
        label: Vollständiger Unternehmensname
        type: string
        required: true
      - name: trust
        label: Kurzangaben unter dem Startbild
        type: string
        list: true

  - name: home
    label: Startseite
    type: file
    path: content/home.json
    format: json
    operations:
      delete: false
      rename: false
    fields:
      - name: title
        label: Hauptüberschrift
        type: text
        required: true
        description: Ein Zeilenumbruch erzeugt eine neue Zeile in der Überschrift.
      - name: text
        label: Einleitungstext
        type: text
        required: true
      - name: image
        label: Großes Hintergrundfoto
        type: image
        required: true
      - name: servicesButton
        label: Beschriftung des Leistungslinks
        type: string
        required: true

  - name: about
    label: Über uns
    type: file
    path: content/about.json
    format: json
    operations:
      delete: false
      rename: false
    fields:
      - name: title
        label: Überschrift
        type: string
        required: true
      - name: text
        label: Text
        type: text
        required: true
        description: Eine Leerzeile trennt zwei Absätze.
      - name: image
        label: Foto
        type: image
        required: true
        description: Dieses Foto wird vollständig und ohne Beschnitt angezeigt.
      - name: alt
        label: Bildbeschreibung
        type: string
        required: true
        description: Beschreibt den Bildinhalt für Menschen mit Sehbeeinträchtigung.
      - name: caption
        label: Bildunterschrift (optional)
        type: string
      - name: contactButton
        label: Beschriftung des Kontaktbuttons
        type: string
        required: true

  - name: services
    label: Leistungen
    type: file
    path: content/services.json
    format: json
    operations:
      delete: false
      rename: false
    fields:
      - name: title
        label: Überschrift des Abschnitts
        type: string
        required: true
      - name: intro
        label: Einleitung (optional)
        type: text
      - name: items
        label: Leistungen hinzufügen, bearbeiten oder sortieren
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title}"
        fields:
          - name: title
            label: Name der Leistung
            type: string
            required: true
          - name: text
            label: Beschreibung
            type: text
            required: true
          - name: image
            label: Foto (optional)
            type: image
            description: Leer lassen, wenn noch kein passendes Foto vorliegt. Die Webseite zeigt dann einen Platzhalter. Zum Ersetzen ein Foto auswählen und speichern.
          - name: alt
            label: Bildbeschreibung
            type: string
            description: Bei einem ausgewählten Foto bitte den Bildinhalt beschreiben. Ohne Foto kann dieses Feld leer bleiben.
          - name: caption
            label: Bildunterschrift (optional)
            type: string

  - name: gallery
    label: Bildergalerie
    type: file
    path: content/gallery.json
    format: json
    operations:
      delete: false
      rename: false
    fields:
      - name: title
        label: Überschrift des Abschnitts
        type: string
        required: true
      - name: intro
        label: Einleitung (optional)
        type: text
      - name: items
        label: Bilder hinzufügen, bearbeiten oder sortieren
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title}"
        fields:
          - name: title
            label: Bildtitel
            type: string
            required: true
          - name: image
            label: Foto
            type: image
            required: true
          - name: alt
            label: Bildbeschreibung
            type: string
            required: true
          - name: text
            label: Beschreibung unter dem Bild (optional)
            type: text

  - name: contact
    label: Kontakt und Adresse
    type: file
    path: content/contact.json
    format: json
    operations:
      delete: false
      rename: false
    fields:
      - name: title
        label: Überschrift
        type: string
        required: true
      - name: text
        label: Kontakttext
        type: text
        required: true
      - name: phone
        label: Telefonnummer für den Anruflink
        type: string
        required: true
        description: International ohne Leerzeichen, zum Beispiel +491727417690.
        pattern:
          regex: '^\+[1-9][0-9]{6,14}$'
          message: Bitte die internationale Telefonnummer angeben, zum Beispiel +491727417690.
      - name: phoneDisplay
        label: Angezeigte Telefonnummer
        type: string
        required: true
      - name: email
        label: E-Mail-Adresse
        type: string
        required: true
        pattern:
          regex: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
          message: Bitte eine gültige E-Mail-Adresse eingeben.
      - name: street
        label: Straße und Hausnummer
        type: string
        required: true
      - name: city
        label: Postleitzahl und Ort
        type: string
        required: true

  - name: legal
    label: Impressum und Datenschutz
    type: file
    path: content/legal.json
    format: json
    operations:
      delete: false
      rename: false
    fields:
      - name: imprint
        label: Impressum
        type: object
        required: true
        fields:
          - name: provider
            label: Anbieterangaben im Impressum
            type: text
            required: true
            description: Dieser Text erscheint direkt unter der Überschrift Impressum. Hier Unternehmensname, Inhaber und Anschrift eintragen. Zeilenumbrüche bleiben erhalten. Telefon und E-Mail kommen aus Kontakt und Adresse.
          - name: notice
            label: Entwurfs- oder Prüfhinweis (optional)
            type: text
            description: Nur für einen zusätzlichen Hinweis in der farbig hinterlegten Box. Unternehmensname, Inhaber und Anschrift gehören in das Feld Anbieterangaben im Impressum oben.
          - name: sections
            label: Weitere Abschnitte des Impressums
            description: Zusätzliche Texte mit eigener Überschrift, zum Beispiel weitere Unternehmensangaben. Sie erscheinen unter den Kontaktdaten.
            type: object
            list: true
            fields:
              - name: title
                label: Überschrift
                type: string
                required: true
              - name: text
                label: Text
                type: text
                required: true
      - name: privacy
        label: Datenschutz
        type: object
        required: true
        fields:
          - name: provider
            label: Verantwortlicher und Anschrift (optional)
            type: text
            description: Erscheint oben in der Datenschutzerklärung. Leer lassen, um automatisch die Anbieterangaben aus dem Impressum zu übernehmen. Telefon und E-Mail kommen aus Kontakt und Adresse.
          - name: notice
            label: Entwurfs- oder Prüfhinweis (optional)
            type: text
            description: Nur für einen zusätzlichen Hinweis in der farbig hinterlegten Box. Die eigentlichen Datenschutztexte gehören in die Abschnitte der Datenschutzerklärung unten.
          - name: sections
            label: Abschnitte der Datenschutzerklärung
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.title}"
            fields:
              - name: title
                label: Überschrift
                type: string
                required: true
              - name: text
                label: Text
                type: text
                required: true
              - name: links
                label: Weiterführende Links (optional)
                type: object
                list: true
                description: Verweise auf Anbieterinformationen oder die Datenschutzaufsicht. Die verlinkten Seiten werden erst beim Anklicken geöffnet.
                fields:
                  - name: label
                    label: Linktext
                    type: string
                    required: true
                  - name: url
                    label: Internetadresse
                    type: string
                    required: true
                    pattern:
                      regex: '^https://[^\s]+$'
                      message: Bitte eine vollständige HTTPS-Adresse ohne Leerzeichen angeben.
